<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" fill="none">
  <!-- 背景 -->
  <rect width="400" height="300" fill="#f0f2f5"/>
  
  <!-- 404 数字 -->
  <g transform="translate(80, 100)">
    <!-- 数字 4 -->
    <path d="M0 0h80l-50 70h35v25h15V70h15V55h-15V0z" fill="#d9d9d9" opacity="0.3"/>
    
    <!-- 数字 0 (第一个) -->
    <ellipse cx="120" cy="35" rx="30" ry="35" stroke="#d9d9d9" stroke-width="12" fill="none" opacity="0.3"/>
    
    <!-- 数字 0 (第二个) -->
    <ellipse cx="210" cy="35" rx="30" ry="35" stroke="#d9d9d9" stroke-width="12" fill="none" opacity="0.3"/>
  </g>
  
  <!-- 搜索图标 -->
  <g transform="translate(160, 200)" opacity="0.2">
    <circle cx="20" cy="20" r="18" stroke="#999" stroke-width="4" fill="none"/>
    <line x1="33" y1="33" x2="48" y2="48" stroke="#999" stroke-width="4" stroke-linecap="round"/>
  </g>
  
  <!-- 问号装饰 -->
  <text x="320" y="250" font-size="80" fill="#e6f7ff" font-weight="bold" opacity="0.5">?</text>
</svg>
