<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" fill="none">
  <!-- 背景 -->
  <rect width="400" height="300" fill="#fffbeb"/>
  
  <!-- 锁形图标主体 -->
  <g transform="translate(140, 80)">
    <!-- 锁身 -->
    <rect x="10" y="50" width="100" height="80" rx="8" fill="#faad14" opacity="0.3"/>
    
    <!-- 锁环 -->
    <path d="M30 50V35c0-20 16-36 36-36s36 16 36 36v15" 
          stroke="#faad14" stroke-width="12" fill="none" stroke-linecap="round" opacity="0.4"/>
    
    <!-- 锁孔 -->
    <circle cx="60" cy="85" r="8" fill="#fff" opacity="0.6"/>
    <rect x="56" y="93" width="8" height="16" rx="2" fill="#fff" opacity="0.6"/>
  </g>
  
  <!-- 禁止符号 -->
  <g transform="translate(280, 180)" opacity="0.15">
    <circle cx="30" cy="30" r="28" stroke="#ff4d4f" stroke-width="6" fill="none"/>
    <line x1="12" y1="12" x2="48" y2="48" stroke="#ff4d4f" stroke-width="6" stroke-linecap="round"/>
  </g>
  
  <!-- 警告三角 -->
  <g transform="translate(60, 220)" opacity="0.1">
    <path d="M30 0L60 50H0L30 0z" fill="#faad14"/>
    <text x="30" y="38" text-anchor="middle" font-size="28" fill="#fff" font-weight="bold">!</text>
  </g>
</svg>
